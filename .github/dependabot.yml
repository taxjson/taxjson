# Weekly dependency update PRs: the pip extras declared in pyproject.toml
# (yfinance, pandas, ...) and the pinned GitHub Actions.
# requirements/*.txt (the installer's hash-pinned locks) are written by
# scripts/lock_deps.py only, so the pip updates skip them (exclude-paths);
# should a pull request edit one anyway, close it and regenerate instead
# (docs/releasing.md, "Dependency locks"); a hand-edited lock fails
# tests/test_dependency_locks.py.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "requirements/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
