name: Bug report
description: Report incorrect tax math, a parser crash, or a regression
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The more reproducible the report, the faster the fix.
        **Do not paste real broker statements.** Redact account numbers and PII first,
        or build a minimal synthetic fixture that reproduces the issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect? What did you actually get?
      placeholder: |
        Ran `taxjson-gains --country CA --year 2024 in.json`. ACB for AAPL.US showed
        $123.45 but I expected $120.00 because of the superficial-loss adjustment
        from the December sale.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal command sequence or a tiny synthetic input that reproduces the issue.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD` or the release tag you're on.
    validations:
      required: true

  - type: dropdown
    id: country
    attributes:
      label: Country rule set
      options:
        - Canada
        - US
        - Other / N/A
    validations:
      required: true

  - type: dropdown
    id: brokerage
    attributes:
      label: Brokerage (if applicable)
      options:
        - Interactive Brokers
        - Questrade
        - RBC Direct Investing
        - Webull
        - Kraken
        - Coinbase
        - Other / N/A

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.8"
