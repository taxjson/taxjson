name: tests

# NOTE: the authoritative gate is scripts/ci.sh, run locally before every
# push; this workflow mirrors its stages (lint, consistency, tax-rules,
# PII, suite, fuzz) for pull requests on the public repo. The PII stage
# here has no private denylist, so it applies the generic patterns
# (account-id shapes, home paths, e-mails, credentials) — enough to stop
# a PR that carries a real-looking id before it is merged — to the tree
# and, on a pull request, to every commit it adds (patch, message,
# identities), as the pre-push hook does. macOS runners
# are excluded to keep the matrix fast.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"     # nightly deep fuzz (UTC)

# The workflow only reads the repository. Actions are pinned to a full
# commit SHA (a moved tag cannot change what runs), the version beside it.
# Every checkout leaves no token behind (persist-credentials: false) and
# every job has a timeout, so a hung step cannot hold a runner for hours.
permissions:
  contents: read

jobs:
  lint:
    # Critical-tier only (syntax errors, undefined names, misused
    # comparisons): the class of defect that once let a dead parameter
    # survive five audit cycles. Style rules are deliberately excluded.
    name: ruff (critical tier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8      # pinned: a new release cannot change the gate
      - run: ruff check --select E9,F63,F7,F82 src/ tests/ packages/

  gates:
    # The ci.sh stages besides lint and the suite: release consistency,
    # the tax-logic spec gate, and the PII scan of the whole tree.
    name: consistency / tax-rules / pii
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: bash scripts/check-consistency.sh
      - run: python scripts/check_tax_rules.py
      - run: bash scripts/check-pii.sh

  secrets:
    # gitleaks (generic secret formats, entropy-checked) on the commits a
    # push or pull request adds — a pull request never passes the
    # maintainer's own pre-push hook. The binary is a pinned release,
    # checked against its sha256 before it runs. On a pull request the
    # allowlist (.gitleaks.toml) is the BASE branch's copy, so a pull
    # request cannot widen the allowlist it is judged by.
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks on the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          V=8.28.0
          cd "$RUNNER_TEMP"
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          cd "$GITHUB_WORKSPACE"
          if [ -n "${BASE:-}" ] && git cat-file -e "$BASE:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
          else
            cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          fi
          FROM="${BASE:-$BEFORE}"
          if [ -n "$FROM" ] && ! echo "$FROM" | grep -qE '^0+$' && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            RANGE="$FROM..$HEAD_SHA"
          else
            RANGE="-1 $HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$RANGE" --config "$RUNNER_TEMP/gitleaks.toml" \
            --redact --no-banner --exit-code 1

  pr-commits:
    # Every commit a pull request adds — its patch, message and author /
    # committer identities — as the pre-push hook checks a push: the tree
    # scan above sees only the final tree, and a value one commit adds
    # and a later one removes is still published by the merge. Generic
    # patterns only (no private files here). The scanner is the BASE
    # branch's copy, so a pull request cannot weaken the check it is
    # judged by.
    if: github.event_name == 'pull_request'
    name: pii / pull-request commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pii/scripts"
          check="$RUNNER_TEMP/pii/scripts/check-pii.sh"
          git show "$BASE_SHA:scripts/check-pii.sh" > "$check"
          range="$BASE_SHA..$HEAD_SHA"
          git log -p --no-merges --format='' "$range" -- | bash "$check" --diff
          git log --no-merges --format=%B "$range" | bash "$check" --message
          git log --no-merges --format='%an <%ae>%n%cn <%ce>' "$range" \
            | sort -u | bash "$check" --identity

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      # The broker-fetch plugin, installed the way a user installs it.
      - name: Install and test taxjson-fetch
        run: |
          pip install --no-deps -e packages/taxjson-fetch
          python -m unittest discover -s packages/taxjson-fetch/tests -p "test_*.py"


  test-extras:
    # One cell with every optional extra installed, so the fx/
    # analytics code paths (yfinance, pandas...) are actually
    # imported in CI instead of silently skipping — the extras rotted
    # undetected before this job existed.
    name: ubuntu / 3.12 / all extras
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

  fuzz-nightly:
    # The three property fuzzers at nightly depth (the suite runs them
    # at 200/150/200 books; this is 5000/3000/1600). Only on the
    # schedule or a manual dispatch — too slow for every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ubuntu / 3.12 / nightly fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Deep fuzz
        env:
          TAXJSON_FUZZ_BOOKS: "5000"
          TAXJSON_TRANSFER_FUZZ_BOOKS: "3000"
          TAXJSON_STRADDLE_FUZZ_BOOKS: "1600"
        run: |
          cd tests
          python -m unittest -q test_engine_invariants test_transfer_fuzz test_settle_straddle_fuzz
