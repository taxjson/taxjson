[project]
name = "taxjson-fetch"
# Released in lockstep with taxjson (scripts/release.sh bumps both).
version = "0.27.2"
description = "Broker auto-fetch for taxjson: Questrade REST API and IBKR Flex Web Service, as a `taxjson fetch` plugin"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "cksci", email = "ckscijdtest@gmail.com" },
]
keywords = ["tax", "taxjson", "questrade", "interactive-brokers", "flex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# The plugin interface (`taxjson fetch` as a dispatcher over the
# taxjson.fetchers entry points) and the parsers its files feed. No
# other runtime dependency: the HTTP clients are stdlib urllib.
dependencies = [
    "taxjson>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/taxjson/taxjson"
Repository = "https://github.com/taxjson/taxjson"

# The core's `taxjson fetch` finds fetchers here (taxjson.lib.fetchers).
[project.entry-points."taxjson.fetchers"]
taxjson-fetch = "taxjson_fetch.plugin:BrokerFetcher"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
