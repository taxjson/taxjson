source = "tfsa_raw_gains.json"
holdings_count = 1
base_cost_basis = "per-account, per-listing, before superficial-loss adjustments, the s.47 blend and [[distributions]] adjustments (total_cost excludes those too; the filing ACB is `tjs list`)"

