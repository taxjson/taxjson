#   DIS STK DIV (shares at $0)                                       -> _build_stock_dividend
#   CIL cash in lieu of a fraction                                   -> _build_cil
#   REI reinvestment, its reversal and the rebooked one              -> _build_reinvestment
#   BRW currency journal, both legs (TO USD / FROM CAD BOOK VALUE)   -> _build_journal
#   TF6 transfer-in under an internal code (Q999001), BOOK VALUE     -> _build_transfer
#   FCH fee                                                          -> _build_fee
#   INT interest                                                     -> _build_interest
