# Row kinds the fixture covers (classify's chain, the builder each reaches):
#   Buy / Sell (stock, a CAD-settled US buy with EXCHANGE RATE, options) -> _build_trade
#   EXP (an option expiry, booked on the contract's expiry day)      -> _build_trade
