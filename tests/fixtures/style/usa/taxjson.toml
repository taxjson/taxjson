## taxjson configuration — https://github.com/taxjson/taxjson
##
## Every key taxjson reads is listed here: [settings] in groups, the other tables' keys
## alphabetically (an account's `type` first), one `=` column per table, so year-over-year projects
## diff cleanly:
##   diff ~/taxes/2023/taxjson.toml ~/taxes/2024/taxjson.toml
## Each key's description is on the `## ` lines above it, the values it takes after it. A
## commented-out key (`# key = value`) shows its default (or an example where it has none): delete
## the `# ` to change it. `tjs format` puts an edited file back into this layout, keeping your
## values and comments.
[settings]

## --- Project ---
country                     = "usa"    # canada | ca | usa | us (required)
## The zone crypto UTC times are dated in (an IANA name). No default: required with a crypto
## account.
local_timezone              = "America/New_York"
## Last year's close-year record (`tjs handoff`). No default.
# prior_year_record         = "../2023/filed/2023.json"
## The oldest taxjson this project runs on: an older one refuses it. Written by `tjs init`,
## `new-year` and `migrate` for the layout they make; never lower it.
# requires_taxjson          = ">=0.27.1"
## Default trade: the IRS dates a sale by trade date.
tax_date                    = "trade"  # trade | settle
## The tax year the pipeline reports on (required).
year                        = 2024

## --- Folders ---
## Where the newest year's run copies its positions and wash radar for other tools. No default.
# exports_dir               = "../exports"
## The year's broker positions snapshots `tjs sanity` reads. Default: holdings/ here.
# holdings_dir              = "holdings"
## The folder of the broker exports (inputs/<account>/), when the years share one beside the year
## folders. Default: inputs/ here.
# inputs_dir                = "../inputs"

## --- Currencies ---
## Report currency: USD.
base_currency               = "USD"
## true: an end-of-run FX-on-cash report (§988, ordinary income).
# fx_cash_gains             = false
## Ledger v2: money from outside the books needs a declared cost (a .tt CASHMOVE line); "spot" takes
## the day's rate for every undeclared inflow instead.
# fx_cash_inflow_cost       = "declared"  # declared | spot
## The FX-on-cash ledger: v1 (the default) reads only trades and income and is NOT RELIABLE — never
## a filing figure; v2 (opt-in, under audit) also reads conversions, deposits/withdrawals and
## statement balances, models margin debt and refuses instead of guessing.
# fx_cash_ledger            = "v1"        # v1 | v2
## Currencies you hold besides USD (their FX rates are fetched). Default none: an all-USD project
## needs nothing here; uncomment it only for an account or trade in another currency.
source_currencies           = []

## --- Options ---
## Options bought more than this many months before expiry count as LEAPS (the leaps and leaps-sum
## views only; no tax figure). Default 9.
# leaps_months              = 9

## --- Income ---
## January fund/REIT dividends taxed as received Dec 31 (IRC §852(b)(7) / §857(b)(9)): "SYMBOL"
## (every January one) or "SYMBOL YYYY-01-DD" (that payment). No default.
# ric_january_dividends     = ["XYZQ.US 2025-01-30"]

## --- Futures ---
## trade (the default): futures and futures options settle on the TRADE date (daily variation
## margin); next_day: the clearing premium date.
# futures_settle            = "trade"  # trade | next_day

## --- Transfers ---
## false (the default): a retirement account's transfer in or out is a move between accounts, never
## a replacement purchase for the wash-sale rule; the run warns once about each transfer-in near a
## loss. true: every such transfer is a purchase or sale on its date (an arrival date in a loss's
## window then stops the run).
# transfers_as_acquisitions = false

## --- Corporate actions ---
## A spin-off or merger in a sheltered account with no saved election: "zero" (the default) books it
## without asking (a spin-off's new shares at $0 cost, a merger's new shares at the old shares'
## cost; no tax depends on it); "ask": asked like a taxable account's. `tjs elect` wins either way.
## cost; no tax depends on it); "ask": asked like a taxable account's. `tjs elect` wins either
# sheltered_elections       = "zero"  # zero | ask
## The `tjs fetch` source of this account (a fetcher plugin's name; `tjs fetch --list` names

## One [accounts.NAME] table per folder under inputs/ (the folder name is the account name). Every
## key, with its default:
# [accounts.NAME]
# type                     = "taxable"  # taxable | sheltered (required)
## The broker account id `tjs fetch` downloads (if its source needs one).
# account                  = "ACCOUNT_ID"
## The broker account ids of this account's statements: a holdings/ snapshot whose [meta] account is
## one of them is this account's. Default: `account`.
# broker_accounts          = ["ACCOUNT_ID"]
## The `tjs fetch` source of this account (a fetcher plugin's name; `tjs fetch --list` names the
## installed ones). No default.
# brokerage                = "SOURCE"
## true: every broker account in these statements is yours, taxable together.
# combined_broker_accounts = false
# crypto                   = false      # true: a Coinbase / Kraken account
## Webull: the exercise/assignment charge on the stock leg. No default: without it no
## exercise/assignment is inferred (each candidate is named).
# exercise_fee             = 1.00
## Positions files `tjs sanity` reconciles against. Default: none.
# holdings                 = ["~/broker/NAME_holdings.toml"]
## The plan when the name doesn't say (default: from the name): ira | roth | 401k | 403b | 457b |
## sep | hsa | 529.
# plan                     = "ira"
## The report (query) id `tjs fetch` runs (if its source needs one).
# query_id                 = "QUERY_ID"
# transfers                = false      # true: keep TRANSFER rows (contributions/withdrawals)
## RBC: the day next year by which year-end book-cost rows are posted. Default 06-30.
# year_end_posting         = "06-30"

[accounts.margin]
type = "taxable"

[accounts.roth]
type      = "sheltered"
plan      = "roth"
transfers = true

[accounts.crypto]
type   = "taxable"
crypto = true

## More accounts: add an [accounts.NAME] table (keys above) and an inputs/NAME
## folder for it.

## Estimate inputs (`tjs estimate`), used when the command-line flags aren't given:
# [estimate]
## The long-term capital loss carryover (Schedule D line 14).
# long_term_losses = 0
## Income besides these books (employment, interest ...).
# other_income     = 0
## The SHORT-term capital loss carryover applied.
# other_losses     = 0

## Losses actually applied on filed returns (`tjs carryover`), by year:
# [carryover]
## Net capital losses applied on each filed return. No default.
# claimed = { 2023 = 4000.00 }

## Non-cash fund distributions (a reinvested capital-gains distribution, a late return-of-capital
## factor): `tjs run` books each as a cost adjustment on the shares held on the record date. One
## table each:
# [[distributions]]
## Per share, in the base currency; negative = return of capital.
# per_share   = 0.25
## The record date.
# record_date = 2024-12-29
## The books' symbol.
# symbol      = "XYZQ.US"
